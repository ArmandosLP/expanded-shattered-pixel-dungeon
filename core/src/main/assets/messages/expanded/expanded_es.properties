## ------------------------- ITEMS ------------------------- ##

## TRINKETS
expanded.items.trinkets.luckycoin.name=moneda de la suerte
expanded.items.trinkets.luckycoin.desc=Las leyendas cuentan que esta moneda perteneció a un rey avaro que le gano a la fortuna misma en un juego de cara o cruz. El ornamento parece atraer mas oro hacia su portador y expandir sus oportunidades de negocio.
expanded.items.trinkets.luckycoin.stats_desc=En su nivel actual este ornamento aumenta la cantidad de oro que encuentres en la mazmorra en un _%s%%_, y la probabilidad de reemplazar una racion de comida por oro en un _%s%%_. Además, aumentará la cantidad de artículos disponibles en las tiendas en _%d_.\n\nEste ornamento cuesta una gran cantidad de energía para ser mejorado.
expanded.items.trinkets.luckycoin.typical_stats_desc=Típicamente este ornamento aumenta la cantidad de oro que encuentres en la mazmorra en un _%s%%_, y la probabilidad de reemplazar una racion de comida por oro en un _%s%%_. Además, aumentará la cantidad de artículos disponibles en las tiendas en _%d_.\n\nEste ornamento cuesta una gran cantidad de energía para ser mejorado.

expanded.items.goldenration.name=Ración de comida dorada
expanded.items.goldenration.desc=Nada lujoso aquí: carne sec...\nNo, espera. Está hecha de oro sólido; tus dientes no lo resistirían.\nTal vez alguien esté dispuesto a pagar un módico precio por él.
expanded.items.goldenration.discover_hint=Puedes encontrar este ítem con un ornamento específico.

expanded.items.trinkets.woodenspoon.name=Cuchara de madera
expanded.items.trinkets.woodenspoon.desc=La madera es resistente cuando lo trabaja un maestro, pero esta cuchara, a pesar de su edad, ha mantenido su forma tan perfectamente que parece magia. Quienquiera que haya sido su dueño ya no está entre nosotros, pero sus obras culinarias perduran.
expanded.items.trinkets.woodenspoon.typical_stats_desc=Típicamente este ornamento _transforma toda la comida_ de la mazmorra, sustituyéndola por _variantes que otorgan beneficios_ al consumirlas.
expanded.items.trinkets.woodenspoon.stats_desc=En su nivel actual este ornamento _transforma toda la comida_ de la mazmorra, sustituyéndola por _variantes que otorgan %s beneficios_ al consumirlas.
expanded.items.trinkets.woodenspoon.level_tiny=pequeños
expanded.items.trinkets.woodenspoon.level_modest=modestos
expanded.items.trinkets.woodenspoon.level_large=grandes
expanded.items.trinkets.woodenspoon.level_huge=enormes
expanded.items.trinkets.woodenspoon.react=Este objeto está reaccionando con tu _cuchara de madera_.
expanded.items.trinkets.woodenspoon.function=Este objeto tiene las mismas funcionalidades que _%s_.
expanded.items.trinkets.woodenspoon.pie_placeholder_name=Quien sabe lo que saldrá de aquí.

## ARTIFACTS
expanded.items.artifacts.spectronomicon.name=Espectronomicon
expanded.items.artifacts.spectronomicon.desc=La espectromancia es el estudio de los espíritus, principalmente practicada por los exiliados y marginados, considerada como magia sucia y maldita.\n\nLos espectros invocados son débiles, no aptos para el combate, y se disipan rápidamente sin un objetivo.\nSu habilidad principal es la provocación inmediata, convirtiéndolos en herramientas de manipulación muy útiles.
expanded.items.artifacts.spectronomicon.upgrade_desc=Este libro, como si de un ser vivo se tratase, tiene hambre y anhela consumir magia. Puedes darle de comer _encantamientos_ o _glifos_, incluso si estos están malditos. La magia maldita saciará menos al libro y no eliminar la maldición del objeto.
expanded.items.artifacts.spectronomicon.desc_cursed=La maldición hace que el hambre del libro sea incontrolable, impidiendo la activación de los efectos mágicos del equipo.

expanded.items.artifacts.spectronomicon.ac_summon=INVOCAR
expanded.items.artifacts.spectronomicon.prompt_summon=Elige un enemigo o ubicación para invocar
expanded.items.artifacts.spectronomicon.no_space=Se necesita especio abierto y accesible para invocar un espectro.
expanded.items.artifacts.spectronomicon.out_of_fov=No puedes invocar espectros fuera de tu campo de vision.
expanded.items.artifacts.spectronomicon.no_charge_multi_summon=El Espectronomicon no tiene cargas suficientes para una invocación multiple.
expanded.items.artifacts.spectronomicon.no_charge=El Espectronomicon no tiene cargas suficientes para una invocación.
expanded.items.artifacts.spectronomicon.cursed=No puedes usar el Espectronomicon maldito.

expanded.items.artifacts.spectronomicon.ac_consume=ABSORBER
expanded.items.artifacts.spectronomicon.prompt_consume=Selecciona un item mágico
expanded.items.artifacts.spectronomicon.consume_cursed_unknown=No posees el conocimiento suficiente sobre este item para absorber su magia.
expanded.items.artifacts.spectronomicon.consume_equipped=No puedes absorber la magia de un item equipado.
expanded.items.artifacts.spectronomicon.consume_no_magic=Este item no posee ningún tipo de magia que el Espectronomicon pueda absorber.
expanded.items.artifacts.spectronomicon.upgrade=La magia del item sacia al Espectronomicon.
expanded.items.artifacts.spectronomicon.upgrade_partial=El Espectronomicon consume la magia del item.

actors.hero.abilities.cleric.trinity.spectronomicon_use=Trinidad invocará espectros con el nivel de Espectronomicon equivalente a _%1$d_, pero la mitad de sus cargas, a costa de _%2$s cargas._

expanded.items.artifacts.spectronomicon$weakwraith.name=Espectro débil
expanded.items.artifacts.spectronomicon$weakwraith.desc=Un espectro muy débil, incapaz de luchar y defenderse.\n\nCreado con el único propósito de provocando a cualquier criatura que suponga un peligro para su amo.

## WEAPONS
items.weapon.melee.morningstar.name=Lucero del alba
items.weapon.melee.morningstar.desc=Un arma ligera con una cabeza pesada, capaz de asestar golpes contundentes con la técnica adecuada.
items.weapon.melee.morningstar.stats_desc=Esta arma se beneficia más del exceso de fuerza.
items.weapon.melee.morningstar.excess_str=Debido a tu exceso de fuerza, causarás _%s-%d de daño adicional_ con esta arma.
items.weapon.melee.morningstar.ability_name=golpe a la cabeza
items.weapon.melee.morningstar.typical_ability_desc=La Duelista puede realizar un _golpe a la cabeza_ con un lucero del alba. Este ataque normalmente inflige _%1$d-%2$d de daño_ y está garantizado a acertar. Si el ataque sorprende al enemigo, lo _paraliza durante un turno_. Se requiere cierto tiempo para poder paralizar de nuevo al mismo enemigo.
items.weapon.melee.morningstar.ability_desc=La Duelista puede realizar un _golpe a la cabeza_ con un lucero del alba. Este ataque inflige _%1$d-%2$d de daño_ y está garantizado a acertar. Si el ataque sorprende al enemigo, lo _paraliza durante un turno_. Se requiere cierto tiempo para poder paralizar de nuevo al mismo enemigo.

expanded.items.weapon.melee.hawkbeak.name=Pica de halcón
expanded.items.weapon.melee.hawkbeak.desc=Un arma de asta con punta de lanza, cabeza de martillo y filo de pico, muy práctica para todas las situaciones.
expanded.items.weapon.melee.hawkbeak.stats_desc=Esta arma tiene un daño muy consistente.
expanded.items.weapon.melee.hawkbeak.ability_name=golpe a la cabeza
expanded.items.weapon.melee.hawkbeak.typical_ability_desc=La Duelista puede realizar un _golpe a la cabeza_ con una pica de halcón. Este ataque normalmente inflige _%1$d-%2$d de daño_ y está garantizado a acertar. Si el ataque sorprende al enemigo, lo _paraliza durante un turno_. Se requiere cierto tiempo para poder paralizar de nuevo al mismo enemigo.
expanded.items.weapon.melee.hawkbeak.ability_desc=La Duelista puede realizar un _golpe a la cabeza_ con una pica de halcón. Este ataque inflige _%1$d-%2$d de daño_ y está garantizado a acertar. Si el ataque sorprende al enemigo, lo _paraliza durante un turno_. Se requiere cierto tiempo para poder paralizar de nuevo al mismo enemigo.

## FOOD
expanded.items.food.bun.name=Bollo
expanded.items.food.bun.desc=Un bollo suave relleno de ternera.
expanded.items.food.bun.spoon_buff=La suave piel del bollo te hace sentir protegido, otorgándote _%d_ de blindaje.

expanded.items.food.honey.name=Miel
expanded.items.food.honey.desc=Un tarro lleno de deliciosa miel.
expanded.items.food.honey.spoon_buff=La dulzura de la miel hace que te sientas vivo, restaurando _%d_ de salud.

expanded.items.food.wheatbread.name=Pan de trigo
expanded.items.food.wheatbread.desc=Una hogaza de pan blanco con el interior tierno y el exterior crujiente.
expanded.items.food.wheatbread.spoon_buff=La energía que obtienes de todos los granos hace que tu piel sea más difícil de penetrar, reduciendo el daño recibido de _%d_ ataques.

expanded.items.food.ryebread.name=Pan de centeno
expanded.items.food.ryebread.desc=Una hogaza de pan integral con un aroma increíble y una textura que no es ni dura ni blanda.
expanded.items.food.ryebread.spoon_buff=El exceso de grasa que aportan los granos absorbe hasta _%d_ de daño. Sin embargo, esta grasa se quema fácilmente al moverse.

expanded.items.food.driedmeat.name=Cecina
expanded.items.food.driedmeat.desc=Un trozo de carne bastante difícil de masticar, pero muy nutritivo.
expanded.items.food.driedmeat.spoon_buff=Este ligero aperitivo te levanta el ánimo, garantizando _%d_ efectos positivos aleatorios.
expanded.items.food.driedmeat.spoon_buff_variant=Este ligero aperitivo te anima, garantizando entre _%d_ o _%d_ efectos positivos aleatorios.
expanded.items.food.driedmeat.inspier=¡Tu mente se llena de inspiración!
expanded.items.food.driedmeat.energy=¡Te sientes lleno de energía!
expanded.items.food.driedmeat.better=¡Te sientes mejor!
expanded.items.food.driedmeat.mindvis=¡Puedes verlo todo!
expanded.items.food.driedmeat.refresh=¡Refrescante!

expanded.items.food.ribs.name=Costillas
expanded.items.food.ribs.desc=Tiernos trozos de carne adheridos a un hueso muy grueso.
expanded.items.food.ribs.spoon_buff=El aroma de un aperitivo tan delicioso te levanta el ánimo, garantizando _%d_ efectos positivos aleatorios.
expanded.items.food.ribs.spoon_buff_variant=El aroma de un aperitivo tan delicioso te levanta el ánimo, garantizando entre _%d_ o _%d_ efectos positivos aleatorios.
expanded.items.food.ribs.inspier=¡Tu mente se llena de inspiración!
expanded.items.food.ribs.energy=¡Te sientes lleno de energía!
expanded.items.food.ribs.hard=¡Sientes que tu piel se endurece!
expanded.items.food.ribs.invis=¡Ves tus manos volverse invisibles!
expanded.items.food.ribs.nature=¡Sientes una conexión con la naturaleza!

expanded.items.food.pasta.name=Pasta
expanded.items.food.pasta.desc=Este plato altamente nutritivo era consumido únicamente por los guardias de la prisión. Algunos rumores indican que altos funcionarios contaminaban la comida con sustancias que volvían a los guardias más fuertes y violentos hacia los prisioneros.
expanded.items.food.pasta.spoon_buff=Los rumores eran ciertos: la sustancia que contiene este plato perturba a quien lo consume, llevándolo a un estado de frenesí que aumenta el daño de su próximo ataque en un _%1$s%%_.

expanded.items.food.gruel.name=Gacha
expanded.items.food.gruel.desc=Este característico plato era el alimento principal de todo prisionero. Es muy nutritivo, pero tiene un olor y una textura desagradables debido a la mezcla indiscriminada de ingredientes. Y por si fuera poco, algunos guardias a veces añadían picantes extremos para prolongar el sufrimiento de los reclusos más violentos.
expanded.items.food.gruel.spoon_buff=El picante extremo lleva al consumidor a estado de ferocidad que dura _%d_ ataques y aumenta el daño infligido en función de la duración del efecto.

expanded.items.food.goldenberry.name=Baya dorada
expanded.items.food.goldenberry.desc=A pesar de su distintivo tono dorado, la baya dorada es difícil de ver, incluso para alguien de vista tan aguda como la cazadora.
expanded.items.food.goldenberry.spoon_buff=La increíble dulzura de la baya dorada la hace irresistible y capaz de proporcionar _%d_ de blindaje a quien la consume.

expanded.items.food.survivalration.name=Ración de supervivencia
expanded.items.food.survivalration.desc=Esta ración fue abandonada por un miembro del Gremio de Ladrones. La has encontrado, pero ¿a qué precio? Las raciones de supervivencia son la última esperanza de un ladrón; abandonarlas es señal de que quien las dejó no logró sobrevivir.
expanded.items.food.survivalration.spoon_buff=Hay una nota detrás de la lata.\n\n"Ya no hay esperanza para mí, pero tú aún puedes escapar. Usa esta ración con precaución, te hará invisible al consumirla."\n\nLa invisibilidad durará _%d_ turnos.

expanded.items.food.hunterssandwich.name=Sandwich de cazador
expanded.items.food.hunterssandwich.desc=Este delicioso sándwich era utilizado por comerciantes y cazadores para mantenerse saciados mientras recorrían largas distancias
expanded.items.food.hunterssandwich.spoon_buff=Además de saciar mucho más que cualquier otra comida, este aumentará el daño que infliges en _%d_ mientras estés bien alimentado.
expanded.items.food.hunterssandwich.huntress_special_buff=Como cazadora que eres, este sándwich te acompañó en casi todos tus viajes por el mundo. Este sandwich te recuerda a tu hogar y a la promesa de salir de aquí con vida. _El sándwich del cazador llena a la cazadora de determinación_.

expanded.items.food.tartedebry.name=Tarta de Brie
expanded.items.food.tartedebry.desc=Esta dulce tarta resulta irresistible para cualquiera, siendo uno de los postres más populares entre la realeza.
expanded.items.food.tartedebry.spoon_buff=Además de saciar mucho más que cualquier otra comida, esta reducirá el daño que recibes en _%d_ mientras estés bien alimentado.
expanded.items.food.tartedebry.cleric_special_buff=Como clérigo perteneciente a la familia real, tuviste muchas oportunidades de probar este lujoso postre. Este postre te recuerda a tu hogar y a la promesa de salir de aquí con vida. _La Tarta de Brie llena al clérigo de determinación_.

## ------------------------- BUFFS ------------------------- ##

expanded.actors.buffs.frenzy.name=Frenesí
expanded.actors.buffs.frenzy.desc=La mente ansía sangre; el cuerpo debe obedecer.\n\nLos próximos _%d_ ataques infligirán un _%s%%_ más de daño.

expanded.actors.buffs.ferocity.name=Ferocidad
expanded.actors.buffs.ferocity.desc=El cuerpo arde por dentro y solo hay una forma de calmarlo.\n\nCada ataque inflige _daño adicional igual a la duración del efecto_ y la reduce en uno.\n\nTurnos restantes y daño adicional: _%d_.

expanded.items.food.wheatbread$carbohydraterush.name=Subidón de carbohidratos
expanded.items.food.wheatbread$carbohydraterush.desc=Las grandes cantidades de carbohidratos que has consumido provocan la acumulación de una capa de grasa que protege los órganos vitales.\n\nEsta grasa reduce el daño que recibes en _1_ para los siguientes _%d_ ataques.\n\nSi sigues comiendo cereales, podrías ganar más grasa.

expanded.items.food.ryebread$carbohydraterush.name=Subidón de carbohidratos
expanded.items.food.ryebread$carbohydraterush.desc=Las grandes cantidades de carbohidratos que has consumido provocan la acumulación de una capa de grasa que protege los órganos vitales.\n\nEsta grasa absorbe hasta _%d_ de daño, pero puede quemarse rápidamente con solo moverse.\n\nSi sigues comiendo cereales, podrías ganar más grasa.

expanded.actors.buffs.soulpact.name=Pacto de alma
expanded.actors.buffs.soulpact.desc=Pactaste con el Deambulador a cambio de bienes.\n\nEl pacto de alma reduce tu salud maxima en _%d_, pero no puede reducirla por debajo de 1.\n\nEsta decisión te perseguira hasta el final.\n¿Valio la pena?

actors.buffs.wellfed.hunter_sandwich_desc=Te sientes bastante satisfecho y lleno.\n\nMientras estás bien alimentado, tu apetito no aumentará y podrás sanar una cantidad adicional de salud con el tiempo.\n\nAdicionalmente, el sandwich de cazador hace que te sientas mas fuerte, causando _%d_ de daño extra.\n\nTurnos restantes: %d.
actors.buffs.wellfed.tarte_de_bry_desc=Te sientes bastante satisfecho y lleno.\n\nMientras estás bien alimentado, tu apetito no aumentará y podrás sanar una cantidad adicional de salud con el tiempo.\n\nAdicionalmente, la tarta de brie hace que te sientas mas resistente, reduciendo en _%d_ el daño recibido.\n\nTurnos restantes: %d.
actors.buffs.wellfed.combo_desc=Te sientes bastante satisfecho y lleno.\n\nMientras estás bien alimentado, tu apetito no aumentará y podrás sanar una cantidad adicional de salud con el tiempo.\n\nAdicionalmente, la tarta de brie y el sandwich de cazador hacen que te sientas mas fuerte y resistente, aumentando en _%d_ el daño causado y reduciendo en _%d_ el recibido.\n\nTurnos restantes: %d.

## Swarm poison stages
expanded.actors.buffs.swarmpoison.name_1=Picazón
expanded.actors.buffs.swarmpoison.desc_1=Es solo una pequeña picadura de mosca.\nSu veneno es _demasiado débil para afectarte_.
expanded.actors.buffs.swarmpoison.name_2=Irritación
expanded.actors.buffs.swarmpoison.desc_2=La dosis hace el veneno.\n_Sientes un ligero mareo_.
expanded.actors.buffs.swarmpoison.name_3=Fiebre
expanded.actors.buffs.swarmpoison.desc_3=El cuerpo se enfría, pero el calor te invade.\n_Todo se siente más pesado_.\n_La cabeza te da vueltas_.
expanded.actors.buffs.swarmpoison.name_4=Delirio
expanded.actors.buffs.swarmpoison.desc_4=El cuerpo ruega por desplomarse.\n¡El veneno está _afectando tus órganos vitales_!\nSin un _antídoto_, la muerte es inevitable.
expanded.actors.buffs.swarmpoison.ondeath=Has muerto por el veneno del enjambre de moscas...

## Shaman's blessings
expanded.actors.buffs.shamanblessing$red.name=Bendición de Chamán Rojo
expanded.actors.buffs.shamanblessing$red.heromsg=¡Te sientes fortalecido!
expanded.actors.buffs.shamanblessing$red.desc=De repente todo se siente más ligero.\n\nEsta bendición aumenta la fuerza física del un personaje, causando que inflija _33%% de daño aumentado_.\n\nTurnos de bendición restantes: %s.

expanded.actors.buffs.shamanblessing$blue.name=Bendición de Chamán Azul
expanded.actors.buffs.shamanblessing$blue.heromsg=¡Te sientes resistente!
expanded.actors.buffs.shamanblessing$blue.desc=El cuerpo se siente más grande e imponente.\n\nEsta bendición _reduce todo el daño físico_ que un personaje recibe en _33%%_, después de que ese daño haya sido reducido por la armadura.\n\nTurnos de bendición restantes: %s.

expanded.actors.buffs.shamanblessing$purple.name=Bendición de Chamán Morado
expanded.actors.buffs.shamanblessing$purple.heromsg=¡Has sido ascendido!
expanded.actors.buffs.shamanblessing$purple.desc=Magia incomprensible que amplifica los instintos, mejorando enormemente los reflejos.\n\nEsta bendición _aumenta la precisión y la evasión en 20%%_, haciendo al objetivo más efectivo en combate.\n\nTurnos de bendición restantes: %s.

expanded.actors.buffs.sticky.name=Pegajoso
expanded.actors.buffs.sticky.desc=La sustancia pegajosa dificulta el movimiento en las piernas. Afortunadamente, este no alcanza a los brazos.\n\nCon _un poco de paciencia_ debería ser _fácil de limpiar_.

expanded.actors.mobs.stronger.strongghoul$willingsacrifice.name=Sacrificio voluntario
expanded.actors.mobs.stronger.strongghoul$willingsacrifice.desc=El dolor ajeno ofrecido como sacrificio para cumplir un objetivo en común.\n\nSacrificio voluntario _recupera progresivamente más salud_, comenzando por 1, y reduce su duración en proporción a la cantidad recuperada.\n\nTurnos restantes: %s.

## ------------------------- GLYPHS ------------------------- ##

expanded.items.armor.glyphs.vitality.name=%s de vitalidad
expanded.items.armor.glyphs.vitality.desc=Este glifo captura el daño recibido convirtiéndolo en vitalidad retenida que se puede recuperar con un ataque.
expanded.items.armor.glyphs.vitality$retainedvitality.name=Vitalidad Retenida
expanded.items.armor.glyphs.vitality$retainedvitality.desc=Salud que se niega a abandonar el cuerpo y que se desvanecerá dentro de poco.\n\nAl encestar un golpe recupera salud equivalente al daño causado, pero no más de _%s_.\n\nMientras Vitalidad Retenida este presente, Glifo de Vitalidad tiene un 100%% de probabilidad de activarse al recibir un golpe.

expanded.items.armor.glyphs.curses.clumsy.name=%s de torpeza
expanded.items.armor.glyphs.curses.clumsy.desc=La Armadura de Torpeza hace que quien la lleva puesta pise trampas y plantas desde una distancia mayor.

## ------------------------- NPC ------------------------- ##

expanded.actors.npc.wanderingimp.name=Deambulador
expanded.actors.npc.wanderingimp.desc=Una criatura con aspecto demoniaco adornado con numerosas joyas. Su vestimenta de algodón color lapislázuli deja en evidencia su riqueza.\n\nNadie llega a ser tan rico sin pisotear a todo aquel que se le cruce.
expanded.actors.npc.wanderingimp.interact=¡Un humano que no está loco! Eso sí que es raro de encontrar.\n\n¿Te gustaría disfrutar de mis mercancías?\nOh no, no quiero tu oro, quiero otra cosita,\nquiero tu alma >:)\nNo toda, solo un pedacito, o lo que estés dispuesto a ofrecerme. A cambio, puedes quedarte con algunas de mis mercancías.\n\nTengo que irme muy pronto, así que no abandones este piso hasta que hayas terminado aquí.
expanded.actors.npc.wanderingimp.yell=Acércate %s, tal vez podamos negociar.
expanded.actors.npc.wanderingimp.discover_hint=Puedes encontrar a este personaje si exploras bien el piso antes de descender.
journal.notes$landmark.wandering_imp=Deambulador

expanded.rooms.soulpactroom$soulpactroomdeco.name=Círculo ritual
expanded.rooms.soulpactroom$soulpactroomdeco.desc=Aquí falta alguien.\nLlegaste _tarde o te fuiste pronto_, en todo caso, ya no hay nada que se pueda hacer aquí.
expanded.rooms.soulpactroom$soulpactroomdeco.wanderer_desc=Una decoración siniestra de forma circular que adorna los artículos a la venta.

## ------------------------- WINDOWS ------------------------- ##

expanded.windows.wndsoultradeitem.pact=Pact for %d Soul

expanded.windows.wndexpandedchallenges.title=Desafíos+
## This should be for scenes.heroselectscene and not expanded.windows.wndexpandedchallenges. For sake of consistency, it will be left as is.
expanded.windows.wndexpandedchallenges.challenges_nowin=Los desafios+ a diferencia de los desafíos normales están diseñados para aportar a la mazmorra con nuevas mecanicas que puedan castigar al jugador o en las condiciones correctas con el conocimiento necesario, ayudarlo.\n\n_Debes ganar al menos una partida antes de poder activar desafíos._
expanded.expandedchallenges.stronger_mobs=Enemigos talentosos
expanded.expandedchallenges.stronger_mobs_desc=Para salir victorioso de un combate no es necesario ser más fuerte que el rival, sino saber aprovechar sus puntos débiles.\nLos heroes esto lo sabes, ¡y los enemigos también!\n\nLas _estadísticas de los enemigos permanecen iguales_.\n\n_Cada enemigo recibe una capacidad adicional_ que moldeara su estrategia de combate.\n\nCon el conocimiento adecuado, tal vez seas capaz de _encontrar nuevos puntos débiles_ de las que aprovecharte.

## ------------------------- BADGES ------------------------- ##

badges$badge.apotheosis.title=Apoteosis
badges$badge.apotheosis.desc=Entra a la sala del jefe final con solo 1 punto de vida maxima, sin arma y armadura equipada y derrótalo sin usar armas, armaduras, armas arrojadizas y varitas

badges$badge.just_a_piece.title=Solo un pedacito
badges$badge.just_a_piece.desc=Acepta un pacto de alma

badges$badge.soul_pact.title=Pacto de alma
