## ------------------------- MOBS ------------------------- ##

## Rat
expanded.actors.mobs.stronger.strongrat.talent=El hedor constante de las alcantarillas se ha acumulado dentro de las ratas, dándoles _inmunidad a la toxicidad_.

## Snake
expanded.actors.mobs.stronger.strongsnake.talent=Su pequeño tamaño le permite _desplazarse entre la hierba sin pisotearla_ y _detectar peligros a través de ella_.

## Gnoll
expanded.actors.mobs.stronger.stronggnoll.talent=Pero no dejes que su apariencia te engañe. Son _conscientes de su entorno_ y hábiles a la hora de aprovecharlo a su favor.

## Slime
expanded.actors.mobs.stronger.strongslime.talent=El líquido interno parece filtrarse a voluntad. Su capacidad adhesiva _ralentiza el movimiento_, dificultando el escape.

## Swarm
expanded.actors.mobs.stronger.strongswarm.talent=El veneno que inyecta tiene poco efecto en el cuerpo de un adulto y puede disiparse con el tiempo.\n_La dosis hace el veneno_.

## Crab
expanded.actors.mobs.stronger.strongcrab.talent=Al detectar una presa, cargarán con extrema violencia, _empujando_ a todo aquel que esté en su camino.

## Guard
expanded.actors.mobs.stronger.strongguard.attack=¡Al ataque!
expanded.actors.mobs.stronger.strongguard.talent=Puedes ver una _segunda cadena_, más larga, oculta en su espalda, pero tiene un acabado más ligero y _no parece estar destinada al combate_.

## Shaman
expanded.actors.mobs.stronger.strongshaman$redshaman.spell_desc=Este chamán está usando una máscara roja y usará magia que _debilita tu poder de ataque_ temporalmente.\n\nAdicionalmente, es capaz de _ofrecer su bendición_ con aquellos que compartan su propósito.
expanded.actors.mobs.stronger.strongshaman$blueshaman.spell_desc=Este chamán está usando una máscara azul y usará magia que _incrementará el daño que recibas_ temporalmente.\n\nAdicionalmente, es capaz de _ofrecer su bendición_ con aquellos que compartan su propósito.
expanded.actors.mobs.stronger.strongshaman$purpleshaman.spell_desc=Este chamán está usando una máscara morada y usará magia que _reduce tu precisión y evasión_ temporalmente.\n\nAdicionalmente, es capaz de _ofrecer su bendición_ con aquellos que compartan su propósito.

## Ghoul
expanded.actors.mobs.stronger.strongghoul.talent=Para un enano, la cooperación lo es todo, por eso están dispuestos a _ofrecer su dolor_ como sacrificio para _apoyar al resto de enanos necrófagos_.

## Warlock
expanded.actors.mobs.stronger.strongwarlock.talent=La obsesión y curiosidad por las artes oscuras ha otorgado a los brujos la capacidad de _controlar su propia sombra para alcanzar a su objetivo_.
expanded.actors.mobs.stronger.strongwarlock$shadow.name=Sombra de brujo
expanded.actors.mobs.stronger.strongwarlock$shadow.desc=La tétrica imagen de un brujo, sin cuerpo ni alma reflejada en el aire.\n\nLas sombras de brujo son meras _herramientas de combate_ que _no tienen voluntad para atacar o moverse_, y se _desvanecen lentamente cuando pierden de vista a su maestro_.

## Monk
expanded.actors.mobs.stronger.strongmonk.talent=Pero el arte del combate no se centra solamente en los puños, sino también en las piernas. Los monjes son capaces de realizar _carreras_ para alcanzar a su objetivo rápidamente. Sin duda, su habilidad más temida es la reconocida _patada del dragón_, capaz de lanzar a su rival volando si no tiene un soporte detrás.

## Golem
expanded.actors.mobs.stronger.stronggolem.talent=También es capaz de _bloquear las puertas con una barrera mágica_ para evitar que su enemigo huya.
expanded.actors.mobs.stronger.stronggolem.doorlock=La puerta se bloquea por una barrera mágica.

## Skeleton
expanded.actors.mobs.stronger.strongskeleton.spear=Este esqueleto ase una lanza de punta metálica embotada.\nEsto le permite _alcanzar a enemigos lejanos_ pero con _daño reducido_. El asta está gravemente dañada, se romperá fácilmente con encestar ataques a corta distancia.
expanded.actors.mobs.stronger.strongskeleton.shield=Este esqueleto porta un escudo de madera.\nEsto le permite, siempre y cuando este consciente, a _bloquear ataques físicos_ negando todo el daño. La madera del escudo está prácticamente podrida, no aguantara muchos golpes.
expanded.actors.mobs.stronger.strongskeleton.sword=Este esqueleto empuña una espada tosca.\nEsto le permite realizar _cortes que provoquen sangrados_ mortales. La hoja, aunque muy afilada, tiembla encima del mango. No aguantaría ni el más mínimo roce contra él.

## Ripper Demon
expanded.actors.mobs.stronger.strongripperdemon.talent=La sed de sangre de los destripadores se vuelve aún _más macabra al oír los chillidos_ de sus parecidos.\nPor desgracia para ellos, sus cuerdas vocales están gravemente dañadas y _sus alertas solo alcanzan a los oídos de otros destripadores_.
expanded.actors.mobs.stronger.strongripperdemon.screech=El chillido del destripador resuena por toda la mazmorra.

## Statue
expanded.actors.mobs.stronger.strongstatue.talent=Puedes ver una _%s_ acoplada a su cintura.
expanded.actors.mobs.stronger.strongstatue.potion=La %s consume la %s de su cintura.

## Demon spawner
expanded.actors.mobs.stronger.strongdemonspawner.talent=Debido a la carencia de capacidades defensivas, los invocadores de demonios dependen de sus criaturas invocadas para protegerse, por ello, han desarrollado un sistema para protegerlos.\n\nAl detectar _magia de alcance extraordinario_, estos _reflejarán la magia_ directamente a su origen con una potencia letalmente amplificada.
expanded.actors.mobs.stronger.strongdemonspawner.reflect=El generador de demonios refleja la magia del %s directamente hacia el héroe.
## "player terror" uses "terror" name
expanded.actors.mobs.stronger.strongdemonspawner$playerterror.desc=El terror es una magia manipuladora que fuerza a su objetivo a un pánico incontrolable.\n\nEl héroe es capaz de mantener la firmeza y oponerse al instinto de huida, sin embargo, el sentimiento de miedo sigue presente, _todos los habitantes de la mazmorra pueden percibirla y rastrear su origen_.\n\nTurnos de terror restantes: %s.
## "player dread" uses "dread" name
expanded.actors.mobs.stronger.strongdemonspawner$playerdread.desc=¡Un terror tan grande que hará que su objetivo huya de la mazmorra por completo!\n\nEl héroe es capaz de mantener la firmeza y oponerse al instinto de huida, sin embargo, el sentimiento de miedo sigue presente, _todos los habitantes de la mazmorra pueden percibirla y rastrear su origen_.\n\nEl pavor es demasiado fuerte, _no puede ser purificado_ por ninguna forma de magia purificadora y solo se disipará con el tiempo o la muerte.\n\nTurnos de pavor restantes: %s.
expanded.actors.mobs.stronger.strongdemonspawner$eternalsleep.name=Sueño eterno
expanded.actors.mobs.stronger.strongdemonspawner$eternalsleep.desc=Este personaje ha caído en un sueño mágico eterno del que solo despertará cuando la magia se disipe por completo.\n\nEl daño no despertará al objetivo condenándolo a una muerte inevitable por inanición.
## "eternal drowsy" uses "drowsy" name
expanded.actors.mobs.stronger.strongdemonspawner$eternaldrowsy.desc=Una fuerza mágica hace imposible permanecer despierto, tras unos pocos turnos, el objetivo caerá en un sueño eterno.\n\nEsta fuerza mágica es demasiado fuerte, no puede ser purificado por ninguna forma de magia purificadora y solo se disipará con el tiempo o la muerte.\n\nTurnos hasta quedar eternamente dormido: %s.
